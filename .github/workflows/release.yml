name: Release

on:
  push:
    tags:
      - "[0-9]*"
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate release version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::Expected a version such as 0.1.1 or 0.1.1b1, optionally prefixed with v"
            exit 1
          fi
          prerelease=false
          if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Adjust packaged version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("custom_components/ecowitt_atomic/manifest.json")
          manifest = json.loads(path.read_text())
          manifest["version"] = os.environ["RELEASE_VERSION"]
          path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: ZIP the integration directory
        working-directory: custom_components/ecowitt_atomic
        run: |
          zip -r "$RUNNER_TEMP/ecowitt_atomic.zip" .

      - name: Publish release with ZIP
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/ecowitt_atomic.zip
